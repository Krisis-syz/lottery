<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="投资计划">
  <meta name="theme-color" content="#0a0e17">
  <script src="js/supabase.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>我的</h1>
    </header>

    <!-- 用户信息卡片 -->
    <section class="profile-card">
      <div class="profile-avatar" id="userAvatar">👤</div>
      <div class="profile-info">
        <div class="profile-email" id="userEmail">未登录</div>
      </div>
    </section>

    <!-- 操作菜单 -->
    <section class="profile-menu">
      <a href="funds.html" class="menu-item" style="text-decoration: none;">
        <span class="menu-icon">💰</span>
        <span class="menu-text">资金管理</span>
        <span class="menu-badge" id="fundBadge" style="display:none;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-right:4px;flex-shrink:0;"></span>
        <span class="menu-arrow">›</span>
      </a>
      <a href="calculator.html" class="menu-item" style="text-decoration: none;">
        <span class="menu-icon">🧮</span>
        <span class="menu-text">跟单计算器</span>
        <span class="menu-arrow">›</span>
      </a>
      <div class="menu-item" onclick="handleThemeToggle()">
        <span class="menu-icon">🌙</span>
        <span class="menu-text">深色模式</span>
        <span class="menu-arrow" id="themeStatus">已开启</span>
      </div>
      <div class="menu-item" onclick="handleLogout()">
        <span class="menu-icon">🚪</span>
        <span class="menu-text">退出登录</span>
        <span class="menu-arrow">›</span>
      </div>
    </section>

    <!-- 版本信息 -->
    <div class="profile-version">
      体彩投资计划 v1.0.1
      <span class="version-info-btn" onclick="showVersionModal()">?</span>
    </div>

    <!-- 版本变迁弹窗 -->
    <div class="modal-overlay" id="versionModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>版本变迁</h3>
          <span class="modal-close" onclick="hideVersionModal()">✕</span>
        </div>
        <div class="modal-body">
          <div class="version-entry">
            <div class="version-tag">v1.0.1</div>
            <div class="version-date">2026-07-28</div>
            <ul class="version-changes">
              <li>新增跟单计算器功能</li>
              <li>连续亏损计算逻辑优化</li>
              <li>UI 颜色优化</li>
            </ul>
          </div>
          <div class="version-entry">
            <div class="version-tag">v1.0.0</div>
            <div class="version-date">2026-07-26</div>
            <ul class="version-changes">
              <li>初始版本发布</li>
              <li>投资计划管理</li>
              <li>投注记录追踪</li>
              <li>收益历史统计</li>
              <li>深色/浅色主题切换</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>主页</a>
    <a href="plans.html" class="nav-item"><span class="nav-icon">📋</span>计划</a>
    <a href="history.html" class="nav-item"><span class="nav-icon">📊</span>历史</a>
    <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span>我的</a>
  </div>

  <style>
    .profile-version {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    .version-info-btn {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid var(--text-muted);
      background: transparent;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 400;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
      margin-left: 4px;
    }

    .version-info-btn:hover {
      border-color: var(--text-secondary);
      color: var(--text-secondary);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      width: 90%;
      max-width: 360px;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--glass-border);
    }

    .modal-header h3 {
      font-size: 1rem;
      font-weight: 600;
    }

    .modal-close {
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
    }

    .modal-body {
      padding: 16px 20px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .version-entry {
      margin-bottom: 20px;
    }

    .version-entry:last-child {
      margin-bottom: 0;
    }

    .version-tag {
      display: inline-block;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #000;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 2px 10px;
      border-radius: 12px;
    }

    .version-date {
      display: inline-block;
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-left: 8px;
    }

    .version-changes {
      list-style: none;
      padding: 0;
      margin: 8px 0 0;
    }

    .version-changes li {
      position: relative;
      padding-left: 16px;
      color: var(--text-secondary);
      font-size: 0.85rem;
      line-height: 1.8;
    }

    .version-changes li::before {
      content: '·';
      position: absolute;
      left: 4px;
      color: var(--gold);
    }
  </style>
  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await waitForSupabase();

      // 检查登录状态
      if (!(await requireAuth())) return;

      // 显示用户信息
      const user = await getCurrentUser();
      if (user) {
        document.getElementById('userEmail').textContent = user.email;
        document.getElementById('userAvatar').textContent = user.email.charAt(0).toUpperCase();
      }

      // 显示当前主题状态
      updateThemeStatus();

      // 检查资金记录未读
      checkFundBadge();
    });

    async function checkFundBadge() {
      try {
        const now = new Date();
        const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        const recorded = await fundApi.checkMonthRecorded(ym);
        document.getElementById('fundBadge').style.display = recorded ? 'none' : 'inline-block';
      } catch (e) {
        // 静默失败
      }
    }

    function updateThemeStatus() {
      const theme = document.documentElement.getAttribute('data-theme') || 'dark';
      document.getElementById('themeStatus').textContent = theme === 'dark' ? '已开启' : '已关闭';
    }

    function handleThemeToggle() {
      toggleTheme();
      updateThemeStatus();
    }

    function handleLogout() {
      if (confirm('确定要退出登录吗？')) {
        signOut();
      }
    }

    function showVersionModal() {
      document.getElementById('versionModal').classList.add('show');
    }

    function hideVersionModal() {
      document.getElementById('versionModal').classList.remove('show');
    }

    document.getElementById('versionModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) hideVersionModal();
    });
  </script>
</body>
</html>
