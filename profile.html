<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="投资计划">
  <meta name="theme-color" content="#0a0e17">
  <script src="js/supabase.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>我的</h1>
    </header>

    <!-- 用户信息卡片 -->
    <section class="profile-card">
      <div class="profile-avatar" id="userAvatar">👤</div>
      <div class="profile-info">
        <div class="profile-email" id="userEmail">未登录</div>
      </div>
    </section>

    <!-- 操作菜单 -->
    <section class="profile-menu">
      <a href="calculator.html" class="menu-item" style="text-decoration: none;">
        <span class="menu-icon">🧮</span>
        <span class="menu-text">跟单计算器</span>
        <span class="menu-arrow">›</span>
      </a>
      <div class="menu-item" onclick="handleThemeToggle()">
        <span class="menu-icon">🌙</span>
        <span class="menu-text">深色模式</span>
        <span class="menu-arrow" id="themeStatus">已开启</span>
      </div>
      <div class="menu-item" onclick="handleLogout()">
        <span class="menu-icon">🚪</span>
        <span class="menu-text">退出登录</span>
        <span class="menu-arrow">›</span>
      </div>
    </section>

    <!-- 版本信息 -->
    <div class="profile-version">
      体彩投资计划 v1.0.0
    </div>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>主页</a>
    <a href="plans.html" class="nav-item"><span class="nav-icon">📋</span>计划</a>
    <a href="history.html" class="nav-item"><span class="nav-icon">📊</span>历史</a>
    <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span>我的</a>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await waitForSupabase();

      // 检查登录状态
      if (!(await requireAuth())) return;

      // 显示用户信息
      const user = await getCurrentUser();
      if (user) {
        document.getElementById('userEmail').textContent = user.email;
        document.getElementById('userAvatar').textContent = user.email.charAt(0).toUpperCase();
      }

      // 显示当前主题状态
      updateThemeStatus();
    });

    function updateThemeStatus() {
      const theme = document.documentElement.getAttribute('data-theme') || 'dark';
      document.getElementById('themeStatus').textContent = theme === 'dark' ? '已开启' : '已关闭';
    }

    function handleThemeToggle() {
      toggleTheme();
      updateThemeStatus();
    }

    function handleLogout() {
      if (confirm('确定要退出登录吗？')) {
        signOut();
      }
    }
  </script>
</body>
</html>
