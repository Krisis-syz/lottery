<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资金管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="投资计划">
  <meta name="theme-color" content="#0a0e17">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/supabase.min.js"></script>
  <style>
    /* ========== 顶部导航 ========== */
    .fund-nav {
      display: flex;
      align-items: center;
      padding: 0 0 16px;
      gap: 12px;
    }

    .fund-back {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 1.1rem;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .fund-back:hover { border-color: var(--gold); color: var(--gold); }

    .fund-nav-title {
      font-size: 1.2rem;
      font-weight: 600;
      flex: 1;
    }

    /* ========== 底部 Tab 栏 ========== */
    .fund-tabs {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 20px;
      backdrop-filter: blur(20px);
    }

    .fund-tab {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 11px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .fund-tab.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #000;
      font-weight: 600;
      box-shadow: 0 2px 8px var(--gold-glow);
    }

    .fund-tab-icon {
      display: block;
      font-size: 1.1rem;
      margin-bottom: 2px;
    }

    /* ========== Tab 内容 ========== */
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ========== FAB 按钮 ========== */
    .fab {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      border: none;
      color: #000;
      font-size: 1.5rem;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--gold-glow);
      transition: all 0.3s ease;
      z-index: 100;
    }

    .fab:hover { transform: translateY(-2px) scale(1.05); }
    .fab:active { transform: scale(0.95); }

    /* ========== 资金卡片 ========== */
    .fund-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 12px;
      backdrop-filter: blur(20px);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .fund-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      border-radius: 4px 0 0 4px;
    }

    .fund-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .fund-card-name {
      font-size: 0.95rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .fund-card-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .fund-card-actions {
      display: flex;
      gap: 6px;
    }

    .fund-card-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .fund-card-btn:hover { border-color: var(--text-secondary); color: var(--text-primary); }
    .fund-card-btn.danger:hover { border-color: #ef4444; color: #ef4444; }

    .fund-card-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .fund-card-currency {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .fund-card-input {
      flex: 1;
      padding: 10px 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .fund-card-input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }

    .fund-card-input::placeholder { color: var(--text-muted); font-weight: 400; }

    .fund-card-hint {
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ========== 新增资金弹窗 ========== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.show { display: flex; }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      width: 85%;
      max-width: 340px;
      padding: 24px 20px;
      animation: scaleIn 0.25s ease;
    }

    @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    .modal-title {
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
    }

    .modal-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 0.95rem;
      margin-bottom: 16px;
      transition: all 0.2s ease;
    }

    .modal-input:focus { outline: none; border-color: var(--gold); }
    .modal-input::placeholder { color: var(--text-muted); }

    .modal-btns {
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .modal-btn-cancel {
      background: var(--bg-secondary);
      color: var(--text-secondary);
    }

    .modal-btn-confirm {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #000;
      font-weight: 600;
    }

    /* ========== 概览 Tab ========== */
    .overview-total-card {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(245, 158, 11, 0.04));
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 16px;
      padding: 24px 20px;
      margin-bottom: 16px;
      text-align: center;
    }

    .overview-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .overview-amount {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--gold);
    }

    .overview-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .overview-sub.up { color: var(--success); }
    .overview-sub.down { color: var(--danger); }

    /* 筛选条 */
    .filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 7px 14px;
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
      font-weight: 600;
    }

    .filter-select {
      padding: 7px 12px;
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 0.8rem;
      cursor: pointer;
    }

    .filter-select:focus { outline: none; border-color: var(--gold); }

    /* 图表 */
    .chart-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      backdrop-filter: blur(20px);
    }

    .chart-card-title {
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 12px;
      color: var(--text-secondary);
    }

    .chart-wrap { position: relative; height: 200px; }

    /* 饼图布局 */
    .pie-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .pie-box { width: 150px; height: 150px; flex-shrink: 0; }

    .legend-list { display: flex; flex-direction: column; gap: 8px; flex: 1; }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }

    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-name { color: var(--text-secondary); }
    .legend-val { font-family: 'JetBrains Mono', monospace; color: var(--text-primary); margin-left: auto; }

    /* 记录表格 */
    .rec-table { width: 100%; border-collapse: collapse; }

    .rec-table th {
      text-align: left;
      padding: 8px 10px;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--glass-border);
    }

    .rec-table td {
      padding: 10px 10px;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .rec-table .mono { font-family: 'JetBrains Mono', monospace; }

    /* ========== AI 报告 Tab ========== */
    .report-current {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      backdrop-filter: blur(20px);
    }

    .report-month-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .report-body {
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 16px;
      font-size: 0.85rem;
      line-height: 1.8;
      color: var(--text-secondary);
      white-space: pre-wrap;
      max-height: 400px;
      overflow-y: auto;
    }

    .report-empty {
      text-align: center;
      padding: 30px 20px;
    }

    .report-empty-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .report-empty-text {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .report-loading {
      text-align: center;
      padding: 30px 20px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--glass-border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-generate {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #000;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 2px 12px var(--gold-glow);
    }

    .btn-generate:hover { transform: translateY(-1px); }
    .btn-generate:disabled { opacity: 0.5; pointer-events: none; }

    .history-dropdown {
      position: relative;
      margin-bottom: 16px;
    }

    .history-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text-secondary);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .history-btn:hover { border-color: var(--gold); }

    .history-btn-arrow {
      transition: transform 0.2s ease;
      font-size: 0.7rem;
    }

    .history-btn-arrow.open { transform: rotate(180deg); }

    .history-list {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      margin-top: 6px;
      overflow: hidden;
    }

    .history-list.show { display: block; animation: fadeIn 0.2s ease; }

    .history-item {
      padding: 12px 16px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .history-item:last-child { border-bottom: none; }
    .history-item:hover { background: var(--bg-secondary); color: var(--text-primary); }
    .history-item.active { color: var(--gold); font-weight: 500; }

    /* ========== 通用 ========== */
    .empty-hint {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .empty-hint-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .save-toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(16, 185, 129, 0.95);
      color: #fff;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      z-index: 2000;
      animation: toastIn 0.3s ease;
    }

    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

    @media (max-width: 768px) {
      .chart-wrap { height: 170px; }
      .pie-row { flex-direction: column; }
      .pie-box { width: 130px; height: 130px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 顶部导航 -->
    <div class="fund-nav">
      <a href="profile.html" class="fund-back">←</a>
      <span class="fund-nav-title">资金管理</span>
    </div>

    <!-- Tab 栏 -->
    <div class="fund-tabs">
      <button class="fund-tab active" onclick="switchTab('fill')">
        <span class="fund-tab-icon">✏️</span>填写资金
      </button>
      <button class="fund-tab" onclick="switchTab('overview')">
        <span class="fund-tab-icon">📊</span>资金总览
      </button>
      <button class="fund-tab" onclick="switchTab('report')">
        <span class="fund-tab-icon">🤖</span>AI 报告
      </button>
    </div>

    <!-- ===== Tab 1: 填写资金 ===== -->
    <div class="tab-content active" id="tabFill">
      <div id="fillCards"></div>
      <button class="btn-generate" id="saveFillBtn" onclick="saveFillRecords()" style="margin-top:8px;display:none;">
        保存本月记录
      </button>
    </div>

    <!-- ===== Tab 2: 资金总览 ===== -->
    <div class="tab-content" id="tabOverview">
      <!-- 筛选条 -->
      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" onclick="setOverviewMode('total')">总资金</button>
        <button class="filter-btn" onclick="setOverviewMode('type')">按类型</button>
        <button class="filter-btn" onclick="setOverviewMode('month')">按月份</button>
        <select class="filter-select" id="filterSelect" style="display:none;" onchange="onFilterSelect()"></select>
      </div>

      <!-- 总金额卡片 -->
      <div class="overview-total-card" id="overviewCard">
        <div class="overview-label">总资产</div>
        <div class="overview-amount" id="overviewAmount">--</div>
        <div class="overview-sub" id="overviewChange"></div>
      </div>

      <!-- 趋势图 -->
      <div class="chart-card">
        <div class="chart-card-title">资金趋势</div>
        <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
      </div>

      <!-- 饼图 -->
      <div class="chart-card">
        <div class="chart-card-title">资金占比</div>
        <div class="pie-row">
          <div class="pie-box"><canvas id="pieChart"></canvas></div>
          <div class="legend-list" id="pieLegend"></div>
        </div>
      </div>

      <!-- 详细记录 -->
      <div class="chart-card">
        <div class="chart-card-title">月度明细</div>
        <div style="overflow-x:auto;">
          <table class="rec-table">
            <thead><tr><th>月份</th><th>总额</th><th>收支</th><th>环比</th><th>同比</th></tr></thead>
            <tbody id="overviewTable"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ===== Tab 3: AI 报告 ===== -->
    <div class="tab-content" id="tabReport">
      <div class="report-current" id="reportCurrent"></div>
      <div class="history-dropdown">
        <button class="history-btn" onclick="toggleHistory()">
          <span>查看历史报告</span>
          <span class="history-btn-arrow" id="historyArrow">▼</span>
        </button>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>

    <!-- FAB 新增按钮 -->
    <button class="fab" id="fabBtn" onclick="showAddModal()">+</button>

    <!-- 新增资金弹窗 -->
    <div class="modal-overlay" id="addModal">
      <div class="modal-box">
        <div class="modal-title">新增资金来源</div>
        <input type="text" class="modal-input" id="addModalInput" placeholder="例如：支付宝、银行卡...">
        <div class="modal-btns">
          <button class="modal-btn modal-btn-cancel" onclick="hideAddModal()">取消</button>
          <button class="modal-btn modal-btn-confirm" onclick="confirmAddSource()">添加</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/funds.js"></script>
</body>
</html>
